name: Bug report
description: Something decodes wrongly, crashes or misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command line, and a small IQ/hex input if you can share one.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `adsb-tracker --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, compiler and version, RTL-SDR gain/antenna if relevant
